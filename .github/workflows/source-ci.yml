name: Source CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-only:
    name: Source-only checks (no Revit runtime)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MCP-Server/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Node dependencies
        shell: pwsh
        run: npm ci --prefix .\MCP-Server --no-audit --no-fund

      - name: Build MCP Server
        shell: pwsh
        run: npm run build --prefix .\MCP-Server

      - name: Run Node offline checks
        shell: pwsh
        run: |
          node .\tests\mcp_protocol_smoke.mjs
          node .\tests\family_evidence_test.mjs
          node .\tests\knowledge_search_test.mjs

      - name: Run static source checks
        shell: pwsh
        run: |
          python .\tests\family_static_contract.py
          python .\tests\family_platform_static_contract.py
          python .\tests\v2_contract_check.py
          python .\tests\combine_static_contract.py
          python .\tests\ribbon_toggle_static_contract.py
          python .\tests\demo_workflow_static_contract.py
          python .\tests\source_format_validation.py

      - name: Run .NET contract checks
        shell: pwsh
        run: .\scripts\test-contracts.ps1

      - name: Verify Revit 2019-2027 build guards
        shell: pwsh
        run: .\tests\multiversion_build_guards.ps1

      - name: State the CI boundary
        shell: pwsh
        run: Write-Host 'PASS source-only CI. This workflow does not claim Revit runtime support.'
